<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

<body>

<h1 id="title">Stroopテスト</h1>

<p id="instruction">
  色を回答！
</p>

<div>
  <div id="word"></div>

  <div id="guide">
    ↑：赤　/　←：青　/　→：緑　/　↓：黄
  </div>

  <div id="message"></div>
</div>

<div id="keymap">
  <div class="arrow-row">
    <div class="keybox">赤</div>
  </div>

  <div class="arrow-row">
    <div class="keybox">青</div>
    <div class="keybox">黄</div>
    <div class="keybox">緑</div>
  </div>
</div>

<script>
"use strict";

/* ==================================================
   刺激と回答キー
================================================== */

const texts = [
  "赤",
  "青",
  "緑",
  "黄"
];

const colors = [
  "red",
  "blue",
  "green",
  "gold"
];

const keyMap = {
  arrowup: "red",
  arrowleft: "blue",
  arrowright: "green",
  arrowdown: "gold"
};

/* ==================================================
   時間設定
================================================== */

const TOTAL_TRIALS = 226;
const INITIAL_WAIT_DURATION = 30000;
const PRE_START_SOUND_TIME = 25000;
const FIXATION_DURATION = 500;
const STIMULUS_DURATION = 2000;

/* ==================================================
   音の設定
================================================== */

/*
最初のEnterキー押下時と
開始5秒前の警告音
*/
const WARNING_TONE = {
  frequency: 659.25,
  duration: 500,
  volume: 0.20
};

/*
タスク開始時と終了時の音
*/
const EVENT_TONE = {
  frequency: 880,
  duration: 600,
  volume: 0.22
};

/* ==================================================
   ブロックごとの条件数
================================================== */

const blockSettings = [
  {
    size: 28,
    counts: {1: 7, 2: 14, 3: 7}
  },
  {
    size: 28,
    counts: {1: 7, 2: 14, 3: 7}
  },
  {
    size: 28,
    counts: {1: 7, 2: 14, 3: 7}
  },
  {
    size: 29,
    counts: {1: 7, 2: 15, 3: 7}
  },
  {
    size: 28,
    counts: {1: 7, 2: 14, 3: 7}
  },
  {
    size: 28,
    counts: {1: 7, 2: 14, 3: 7}
  },
  {
    size: 28,
    counts: {1: 7, 2: 14, 3: 7}
  },
  {
    size: 29,
    counts: {1: 8, 2: 14, 3: 7}
  }
];

/* ==================================================
   状態変数
================================================== */

let trialSequence = [];
let trialIndex = 0;

let currentTrial = null;
let stimulusStartTime = null;

let isWaiting = false;
let isRunning = false;
let audioUnlocked = false;

let stimulusVisible = false;
let firstResponseRecorded = false;

let initialWaitTimer = null;
let preStartSoundTimer = null;
let countdownTimer = null;
let fixationTimer = null;
let stimulusTimer = null;

let csvLog = [];
let pendingDuplicateResponses = [];

let taskStartDate = null;
let taskEndDate = null;

let audioContext = null;

/* ==================================================
   画面表示
================================================== */

function hideAllScreenElements() {
  document.getElementById("title").style.display = "none";
  document.getElementById("instruction").style.display = "none";
  document.getElementById("word").style.display = "none";
  document.getElementById("guide").style.display = "none";
  document.getElementById("message").style.display = "none";
  document.getElementById("keymap").style.display = "none";
}

function showInitialScreen() {
  hideAllScreenElements();

  const message =
    document.getElementById("message");

  message.textContent =
    "Enterキーを押して待機を開始してください";

  message.style.display = "block";
  message.style.fontSize = "32px";
  message.style.fontWeight = "bold";
  message.style.marginTop = "180px";
}

function showWaitingScreen() {
  hideAllScreenElements();

  const title =
    document.getElementById("title");

  const word =
    document.getElementById("word");

  const message =
    document.getElementById("message");

  title.style.display = "block";

  word.style.display = "flex";
  setWordAppearance();
  word.textContent = "✖";
  word.style.color = "black";

  message.style.display = "block";
  message.textContent =
    "開始まで注視点を見て待機してください";
  message.style.fontSize = "24px";
  message.style.fontWeight = "bold";
  message.style.marginTop = "20px";
}

function showTaskScreen() {
  hideAllScreenElements();

  document.getElementById(
    "title"
  ).style.display = "block";

  const wordDiv =
    document.getElementById("word");

  wordDiv.style.display = "flex";

  setWordAppearance();

  document.getElementById(
    "keymap"
  ).style.display = "flex";
}

function showEndScreen() {
  hideAllScreenElements();

  document.getElementById(
    "title"
  ).style.display = "block";

  const wordDiv =
    document.getElementById("word");

  wordDiv.style.display = "flex";

  setWordAppearance();

  wordDiv.textContent = "終了！";
  wordDiv.style.color = "black";
}

function showErrorScreen(errorMessage) {
  hideAllScreenElements();

  const message =
    document.getElementById("message");

  message.style.display = "block";
  message.style.fontSize = "24px";
  message.style.fontWeight = "bold";
  message.style.marginTop = "180px";
  message.textContent = errorMessage;
}

function setWordAppearance() {
  const wordDiv =
    document.getElementById("word");

  wordDiv.style.fontFamily = "sans-serif";
  wordDiv.style.fontSize = "64px";
  wordDiv.style.fontWeight = "normal";
  wordDiv.style.lineHeight = "1";
}

/* ==================================================
   音声
================================================== */

function getAudioContext() {
  if (audioContext === null) {
    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (AudioContextClass) {
      audioContext =
        new AudioContextClass();
    }
  }

  return audioContext;
}

async function unlockAudio() {
  const context =
    getAudioContext();

  if (!context) {
    throw new Error(
      "このブラウザでは音声機能を利用できません。"
    );
  }

  if (
    context.state !== "running"
  ) {
    await context.resume();
  }

  const oscillator =
    context.createOscillator();

  const gain =
    context.createGain();

  gain.gain.setValueAtTime(
    0.0001,
    context.currentTime
  );

  oscillator.connect(gain);

  gain.connect(
    context.destination
  );

  oscillator.start(
    context.currentTime
  );

  oscillator.stop(
    context.currentTime + 0.02
  );
}

async function playTone(
  frequency,
  durationMs,
  volume = 0.22
) {
  try {
    const context =
      getAudioContext();

    if (!context) {
      return false;
    }

    if (
      context.state !== "running"
    ) {
      await context.resume();
    }

    const oscillator =
      context.createOscillator();

    const gain =
      context.createGain();

    const now =
      context.currentTime;

    const duration =
      durationMs / 1000;

    const attack =
      Math.min(
        0.08,
        duration * 0.25
      );

    const release =
      Math.min(
        0.22,
        duration * 0.45
      );

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
      frequency,
      now
    );

    gain.gain.setValueAtTime(
      0.0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      volume,
      now + attack
    );

    gain.gain.setValueAtTime(
      volume,
      now + Math.max(
        attack,
        duration - release
      )
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + duration
    );

    oscillator.connect(gain);

    gain.connect(
      context.destination
    );

    oscillator.start(now);

    oscillator.stop(
      now + duration
    );

    return true;

  } catch (error) {
    console.error(
      "音声を再生できませんでした。",
      error
    );

    return false;
  }
}

/*
最初のEnterキーと開始5秒前の音
*/
function playWarningTone() {
  void playTone(
    WARNING_TONE.frequency,
    WARNING_TONE.duration,
    WARNING_TONE.volume
  );
}

/*
タスク開始時と終了時の音
*/
function playEventTone() {
  void playTone(
    EVENT_TONE.frequency,
    EVENT_TONE.duration,
    EVENT_TONE.volume
  );
}

/* ==================================================
   シャッフル
================================================== */

function shuffle(array) {
  const copied =
    [...array];

  for (
    let i = copied.length - 1;
    i > 0;
    i--
  ) {
    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      copied[i],
      copied[j]
    ] = [
      copied[j],
      copied[i]
    ];
  }

  return copied;
}

function wouldMakeFourConsecutive(
  array,
  value
) {
  if (
    array.length < 3
  ) {
    return false;
  }

  return (
    array[
      array.length - 1
    ] === value &&

    array[
      array.length - 2
    ] === value &&

    array[
      array.length - 3
    ] === value
  );
}

/* ==================================================
   条件系列を生成
================================================== */

function generateConditionSequence() {
  const completeSequence = [];

  for (
    const block
    of blockSettings
  ) {
    let selectedBlock = null;

    for (
      let attempt = 0;
      attempt < 10000;
      attempt++
    ) {
      const candidate = [];

      for (
        let i = 0;
        i < block.counts[1];
        i++
      ) {
        candidate.push(1);
      }

      for (
        let i = 0;
        i < block.counts[2];
        i++
      ) {
        candidate.push(2);
      }

      for (
        let i = 0;
        i < block.counts[3];
        i++
      ) {
        candidate.push(3);
      }

      const shuffledCandidate =
        shuffle(candidate);

      const combined = [
        ...completeSequence,
        ...shuffledCandidate
      ];

      let valid = true;

      for (
        let i = 3;
        i < combined.length;
        i++
      ) {
        if (
          combined[i] ===
            combined[i - 1] &&
          combined[i] ===
            combined[i - 2] &&
          combined[i] ===
            combined[i - 3]
        ) {
          valid = false;
          break;
        }
      }

      if (valid) {
        selectedBlock =
          shuffledCandidate;

        break;
      }
    }

    if (
      selectedBlock === null
    ) {
      throw new Error(
        "条件系列を生成できませんでした。"
      );
    }

    completeSequence.push(
      ...selectedBlock
    );
  }

  return completeSequence;
}

/* ==================================================
   刺激候補を作成
================================================== */

function makeStimulusCandidates(
  condition
) {
  const candidates = [];

  if (condition === 1) {
    for (
      let i = 0;
      i < colors.length;
      i++
    ) {
      candidates.push({
        condition: 1,
        text: texts[i],
        color: colors[i],
        stimulusId:
          texts[i] +
          "_" +
          colors[i]
      });
    }
  }

  if (condition === 2) {
    for (
      let textIndex = 0;
      textIndex < texts.length;
      textIndex++
    ) {
      for (
        let colorIndex = 0;
        colorIndex < colors.length;
        colorIndex++
      ) {
        if (
          textIndex !==
          colorIndex
        ) {
          candidates.push({
            condition: 2,
            text:
              texts[textIndex],
            color:
              colors[colorIndex],
            stimulusId:
              texts[textIndex] +
              "_" +
              colors[colorIndex]
          });
        }
      }
    }
  }

  if (condition === 3) {
    for (
      let i = 0;
      i < colors.length;
      i++
    ) {
      candidates.push({
        condition: 3,
        text: "●",
        color: colors[i],
        stimulusId:
          "●_" +
          colors[i]
      });
    }
  }

  return candidates;
}

/* ==================================================
   刺激系列を生成
================================================== */

function generateTrialSequence() {
  for (
    let sequenceAttempt = 0;
    sequenceAttempt < 1000;
    sequenceAttempt++
  ) {
    const conditionSequence =
      generateConditionSequence();

    const generatedTrials = [];

    let failed = false;

    for (
      const condition
      of conditionSequence
    ) {
      const candidates =
        shuffle(
          makeStimulusCandidates(
            condition
          )
        );

      let selectedStimulus =
        null;

      for (
        const candidate
        of candidates
      ) {
        const previousTrial =
          generatedTrials.length > 0
            ? generatedTrials[
                generatedTrials.length - 1
              ]
            : null;

        if (
          previousTrial !== null &&
          previousTrial.stimulusId ===
            candidate.stimulusId
        ) {
          continue;
        }

        const previousColors =
          generatedTrials.map(
            trial =>
              trial.color
          );

        if (
          wouldMakeFourConsecutive(
            previousColors,
            candidate.color
          )
        ) {
          continue;
        }

        selectedStimulus =
          candidate;

        break;
      }

      if (
        selectedStimulus === null
      ) {
        failed = true;
        break;
      }

      generatedTrials.push({
        ...selectedStimulus
      });
    }

    if (
      !failed &&
      generatedTrials.length ===
        TOTAL_TRIALS
    ) {
      validateSequence(
        generatedTrials
      );

      return generatedTrials;
    }
  }

  throw new Error(
    "刺激系列を生成できませんでした。"
  );
}

/* ==================================================
   条件数の集計
================================================== */

function countConditions(
  sequence
) {
  const counts = {
    1: 0,
    2: 0,
    3: 0
  };

  sequence.forEach(
    trial => {
      counts[
        trial.condition
      ]++;
    }
  );

  return counts;
}

/* ==================================================
   系列の検証
================================================== */

function validateSequence(
  sequence
) {
  if (
    sequence.length !==
    TOTAL_TRIALS
  ) {
    throw new Error(
      "総試行数が226回ではありません。"
    );
  }

  let startIndex = 0;

  blockSettings.forEach(
    (
      block,
      blockIndex
    ) => {
      const blockTrials =
        sequence.slice(
          startIndex,
          startIndex +
            block.size
        );

      const counts =
        countConditions(
          blockTrials
        );

      if (
        counts[1] !==
          block.counts[1] ||
        counts[2] !==
          block.counts[2] ||
        counts[3] !==
          block.counts[3]
      ) {
        throw new Error(
          "ブロック" +
          (blockIndex + 1) +
          "の条件数が不正です。"
        );
      }

      startIndex +=
        block.size;
    }
  );

  for (
    let i = 1;
    i < sequence.length;
    i++
  ) {
    if (
      sequence[i].stimulusId ===
      sequence[i - 1].stimulusId
    ) {
      throw new Error(
        "同一刺激の連続が検出されました。"
      );
    }

    if (i >= 3) {
      if (
        sequence[i].condition ===
          sequence[i - 1].condition &&
        sequence[i].condition ===
          sequence[i - 2].condition &&
        sequence[i].condition ===
          sequence[i - 3].condition
      ) {
        throw new Error(
          "同一条件の4連続が検出されました。"
        );
      }

      if (
        sequence[i].color ===
          sequence[i - 1].color &&
        sequence[i].color ===
          sequence[i - 2].color &&
        sequence[i].color ===
          sequence[i - 3].color
      ) {
        throw new Error(
          "同一正解色の4連続が検出されました。"
        );
      }
    }
  }

  const firstHalf =
    countConditions(
      sequence.slice(
        0,
        113
      )
    );

  if (
    firstHalf[1] !== 28 ||
    firstHalf[2] !== 57 ||
    firstHalf[3] !== 28
  ) {
    throw new Error(
      "前半113試行の条件数が不正です。"
    );
  }

  const secondHalf =
    countConditions(
      sequence.slice(
        113,
        226
      )
    );

  if (
    secondHalf[1] !== 29 ||
    secondHalf[2] !== 56 ||
    secondHalf[3] !== 28
  ) {
    throw new Error(
      "後半113試行の条件数が不正です。"
    );
  }
}

/* ==================================================
   最初のEnterキー
================================================== */

document.addEventListener(
  "keydown",
  handleInitialEnter
);

function handleInitialEnter(
  event
) {
  if (
    event.key !== "Enter" ||
    event.repeat ||
    audioUnlocked ||
    isWaiting ||
    isRunning
  ) {
    return;
  }

  event.preventDefault();

  unlockAudio()
    .then(() => {
      audioUnlocked = true;

      document.removeEventListener(
        "keydown",
        handleInitialEnter
      );

      /*
      最初のEnterキー押下時に、
      開始5秒前と同じ音を鳴らします。
      */
      playWarningTone();

      beginInitialWaiting();
    })
    .catch(error => {
      console.error(error);

      const message =
        document.getElementById(
          "message"
        );

      message.textContent =
        "音声を有効にできませんでした。もう一度Enterキーを押してください。";
    });
}

/* ==================================================
   開始5秒前のカウントダウン
================================================== */

function startCountdown() {
  let remainingSeconds = 5;

  const message =
    document.getElementById(
      "message"
    );

  /*
  最初のEnterキー押下時と同じ音
  */
  playWarningTone();

  message.textContent =
    String(
      remainingSeconds
    );

  message.style.fontSize =
    "42px";

  countdownTimer =
    setInterval(
      () => {
        remainingSeconds--;

        if (
          remainingSeconds >= 1
        ) {
          message.textContent =
            String(
              remainingSeconds
            );

        } else {
          clearInterval(
            countdownTimer
          );

          countdownTimer = null;
          message.textContent = "";
        }
      },
      1000
    );
}

/* ==================================================
   30秒間の待機
================================================== */

function beginInitialWaiting() {
  try {
    trialSequence =
      generateTrialSequence();

  } catch (error) {
    console.error(error);

    showErrorScreen(
      "系列の生成に失敗しました。ページを再読み込みしてください。"
    );

    return;
  }

  isWaiting = true;

  trialIndex = 0;
  csvLog = [];

  pendingDuplicateResponses =
    [];

  currentTrial = null;

  taskStartDate = null;
  taskEndDate = null;

  showWaitingScreen();

  preStartSoundTimer =
    setTimeout(
      () => {
        if (!isWaiting) {
          return;
        }

        startCountdown();
      },
      PRE_START_SOUND_TIME
    );

  initialWaitTimer =
    setTimeout(
      startTask,
      INITIAL_WAIT_DURATION
    );
}

/* ==================================================
   タスク開始
================================================== */

function startTask() {
  if (!isWaiting) {
    return;
  }

  isWaiting = false;
  isRunning = true;

  if (
    countdownTimer !== null
  ) {
    clearInterval(
      countdownTimer
    );

    countdownTimer = null;
  }

  trialIndex = 0;
  currentTrial = null;

  stimulusVisible = false;

  firstResponseRecorded =
    false;

  /*
  タスク開始時の音
  */
  playEventTone();

  taskStartDate =
    new Date();

  showTaskScreen();

  /*
  タスク開始直後は、
  注視点500 msから開始します。
  */
  showFixation();
}

/* ==================================================
   注視点
================================================== */

function showFixation() {
  if (!isRunning) {
    return;
  }

  if (
    trialIndex >=
    TOTAL_TRIALS
  ) {
    endTest();
    return;
  }

  const wordDiv =
    document.getElementById(
      "word"
    );

  setWordAppearance();

  wordDiv.textContent = "✖";
  wordDiv.style.color = "black";

  stimulusVisible = false;

  firstResponseRecorded =
    false;

  currentTrial = null;

  fixationTimer =
    setTimeout(
      showStimulus,
      FIXATION_DURATION
    );
}

/* ==================================================
   刺激提示
================================================== */

function showStimulus() {
  if (!isRunning) {
    return;
  }

  currentTrial =
    trialSequence[
      trialIndex
    ];

  firstResponseRecorded =
    false;

  currentTrial.firstRT = "";
  currentTrial.firstAnswer = "";
  currentTrial.correct = 0;
  currentTrial.code = 4;

  const wordDiv =
    document.getElementById(
      "word"
    );

  requestAnimationFrame(
    () => {
      setWordAppearance();

      wordDiv.textContent =
        currentTrial.text;

      wordDiv.style.color =
        currentTrial.color;

      stimulusStartTime =
        performance.now();

      recordPendingDuplicateResponses(
        stimulusStartTime
      );

      stimulusVisible = true;

      stimulusTimer =
        setTimeout(
          finishCurrentTrial,
          STIMULUS_DURATION
        );
    }
  );
}

/* ==================================================
   追加押下の記録
================================================== */

function recordPendingDuplicateResponses(
  nextStimulusTime
) {
  pendingDuplicateResponses.forEach(
    response => {
      const negativeRT =
        Math.round(
          response.pressTime -
          nextStimulusTime
        );

      csvLog.push({
        type: "duplicate",
        trial: "",
        condition:
          response.condition,
        rt:
          negativeRT,
        code: 5,
        correct: "",
        sortTime:
          response.pressTime
      });
    }
  );

  pendingDuplicateResponses =
    [];
}

/* ==================================================
   矢印キー入力
================================================== */

document.addEventListener(
  "keydown",
  event => {
    if (
      !isRunning ||
      !stimulusVisible ||
      event.repeat
    ) {
      return;
    }

    const key =
      event.key.toLowerCase();

    if (!(key in keyMap)) {
      return;
    }

    event.preventDefault();

    const answerColor =
      keyMap[key];

    const pressTime =
      performance.now();

    const rt =
      Math.round(
        pressTime -
        stimulusStartTime
      );

    if (
      rt < 0 ||
      rt >
        STIMULUS_DURATION
    ) {
      return;
    }

    if (
      !firstResponseRecorded
    ) {
      firstResponseRecorded = true;

      currentTrial.firstRT = rt;

      currentTrial.firstAnswer =
        answerColor;

      currentTrial.correct =
        answerColor ===
        currentTrial.color
          ? 1
          : 0;

      if (rt <= 100) {
        currentTrial.code = 3;

      } else if (
        currentTrial.correct === 1
      ) {
        currentTrial.code = 1;

      } else {
        currentTrial.code = 2;
      }

    } else {
      pendingDuplicateResponses.push({
        pressTime:
          pressTime,
        condition:
          currentTrial.condition
      });
    }
  }
);

/* ==================================================
   現在の試行を終了
================================================== */

function finishCurrentTrial() {
  if (
    !isRunning ||
    currentTrial === null
  ) {
    return;
  }

  stimulusVisible =
    false;

  if (
    !firstResponseRecorded
  ) {
    currentTrial.firstRT = "";
    currentTrial.correct = 0;
    currentTrial.code = 4;
  }

  csvLog.push({
    type:
      "representative",
    trial:
      trialIndex + 1,
    condition:
      currentTrial.condition,
    rt:
      currentTrial.firstRT,
    code:
      currentTrial.code,
    correct:
      currentTrial.correct,
    sortTime:
      stimulusStartTime
  });

  trialIndex++;

  if (
    trialIndex >=
    TOTAL_TRIALS
  ) {
    endTest();

  } else {
    showFixation();
  }
}

/* ==================================================
   時刻とCSV
================================================== */

function formatTime(date) {
  return (
    String(
      date.getHours()
    ).padStart(2, "0") +
    ":" +
    String(
      date.getMinutes()
    ).padStart(2, "0") +
    ":" +
    String(
      date.getSeconds()
    ).padStart(2, "0")
  );
}

function csvEscape(value) {
  const stringValue =
    String(
      value ?? ""
    );

  if (
    stringValue.includes(",") ||
    stringValue.includes('"') ||
    stringValue.includes("\n") ||
    stringValue.includes("\r")
  ) {
    return (
      '"' +
      stringValue.replace(
        /"/g,
        '""'
      ) +
      '"'
    );
  }

  return stringValue;
}

function makeCsvRow(values) {
  return values
    .map(csvEscape)
    .join(",");
}

/* ==================================================
   タスク終了
================================================== */

function endTest() {
  if (!isRunning) {
    return;
  }

  isRunning = false;
  stimulusVisible = false;

  clearTimeout(
    fixationTimer
  );

  clearTimeout(
    stimulusTimer
  );

  clearTimeout(
    initialWaitTimer
  );

  clearTimeout(
    preStartSoundTimer
  );

  if (
    countdownTimer !== null
  ) {
    clearInterval(
      countdownTimer
    );

    countdownTimer = null;
  }

  taskEndDate =
    new Date();

  /*
  タスク終了時に、
  タスク開始時と同じ音を鳴らします。
  */
  playEventTone();

  /*
  最終試行の追加押下は、
  次の刺激がないためRTを空欄にします。
  */
  pendingDuplicateResponses.forEach(
    response => {
      csvLog.push({
        type: "duplicate",
        trial: "",
        condition:
          response.condition,
        rt: "",
        code: 5,
        correct: "",
        sortTime:
          response.pressTime
      });
    }
  );

  pendingDuplicateResponses =
    [];

  csvLog.sort(
    (a, b) =>
      a.sortTime -
      b.sortTime
  );

  showEndScreen();

  const conditionCounts =
    countConditions(
      trialSequence
    );

  const totalRows =
    Math.max(
      csvLog.length + 1,
      12
    );

  const outputRows =
    Array.from(
      {
        length:
          totalRows
      },
      () =>
        Array(8).fill("")
    );

  outputRows[0] = [
    "trial",
    "条件",
    "RT",
    "Code",
    "正誤",
    "Time",
    "Summary",
    "Count"
  ];

  csvLog.forEach(
    (
      row,
      index
    ) => {
      outputRows[
        index + 1
      ][0] =
        row.trial;

      outputRows[
        index + 1
      ][1] =
        row.condition;

      outputRows[
        index + 1
      ][2] =
        row.rt;

      outputRows[
        index + 1
      ][3] =
        row.code;

      outputRows[
        index + 1
      ][4] =
        row.correct;
    }
  );

  outputRows[1][5] =
    formatTime(
      taskStartDate
    );

  outputRows[2][5] =
    formatTime(
      taskEndDate
    );

  outputRows[1][6] = "条件1";
  outputRows[1][7] =
    conditionCounts[1];

  outputRows[2][6] = "条件2";
  outputRows[2][7] =
    conditionCounts[2];

  outputRows[3][6] = "条件3";
  outputRows[3][7] =
    conditionCounts[3];

  outputRows[5][6] = "Code";
  outputRows[5][7] = "区分";

  outputRows[6][6] = 1;
  outputRows[6][7] =
    "正答（有効）";

  outputRows[7][6] = 2;
  outputRows[7][7] =
    "誤答（有効）";

  outputRows[8][6] = 3;
  outputRows[8][7] =
    "対象外（早期）";

  outputRows[9][6] = 4;
  outputRows[9][7] =
    "対象外（無反応）";

  outputRows[10][6] = 5;
  outputRows[10][7] =
    "対象外（重複）";

  const csv =
    "\uFEFF" +
    outputRows
      .map(makeCsvRow)
      .join("\r\n");

  const now =
    new Date();

  const stamp =
    String(
      now.getFullYear()
    ) +
    String(
      now.getMonth() + 1
    ).padStart(2, "0") +
    String(
      now.getDate()
    ).padStart(2, "0") +
    "_" +
    String(
      now.getHours()
    ).padStart(2, "0") +
    String(
      now.getMinutes()
    ).padStart(2, "0") +
    String(
      now.getSeconds()
    ).padStart(2, "0");

  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const link =
    document.createElement(
      "a"
    );

  link.href = url;

  link.download =
    "stroop_" +
    stamp +
    ".csv";

  document.body.appendChild(
    link
  );

  link.click();
  link.remove();

  setTimeout(
    () => {
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );
}

/* ==================================================
   ページ読み込み時
================================================== */

showInitialScreen();
</script>
